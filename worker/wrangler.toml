name = "keith-pronos"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Déclenchements automatiques (heures UTC) :
# 05:30 = génération du jour + validation des matchs d'hier
# 23:30 = validation des matchs du jour terminés
[triggers]
crons = ["30 5 * * *", "30 23 * * *"]

# Base clé-valeur où le Worker range les pronostics.
# Crée-la d'abord :  npx wrangler kv namespace create PREDICTIONS_KV
# puis colle l'id renvoyé ci-dessous.
[[kv_namespaces]]
binding = "PREDICTIONS_KV"
id = "REMPLACE_PAR_TON_ID_KV"

# Secrets (à définir dans le tableau de bord Cloudflare ou via
# `npx wrangler secret put NOM`) — jamais dans ce fichier :
#   APINEX_API_KEY, API_FOOTBALL_KEY, ADMIN_SECRET
# Variable optionnelle : APINEX_MODEL (défaut : free/glm-5.3-flash)
