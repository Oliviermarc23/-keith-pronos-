name: KEITH Pronos — routine quotidienne

on:
  schedule:
    # Heures UTC : 05:30 (génération + validation d'hier), 23:30 (validation du soir)
	○  cron: "30 5 * * *"
	○  cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
		■  uses: actions/checkout@v4
		■  uses: actions/setup-node@v4
        with:
          node-version: "20"
		■  name: Générer les icônes si absentes
        run: |
          if [ ! -f icons/icon-512.png ]; then
            pip install -q pillow
            python pipeline/make_icons.py
          fi
		■  name: Mettre à jour les matchs, pronostics et verdicts
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
        run: node pipeline/generate.mjs
		■  name: Publier les changements si modifiés
        run: |
          git config user.name "keith-pronos-bot"
          git config user.email "actions@github.com"
          git add days.json icons
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour quotidienne des pronostics"
            git push
          fi

