<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEITH Pronos — les plus grands matchs, chaque jour</title>
<meta name="description" content="Chaque jour, les 15 plus grands matchs analysés : 1 pronostic par match, validé automatiquement après le coup de sifflet final.">
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="styles.css">

<body>
<header class="topbar">

    <span class="brand-badge">K</span>
    <div>

      <p>Les plus grands matchs, analysés chaque jour</p>
    </div>

<div id="iosInstallHint" class="ios-hint" hidden>
  Pour installer sur iPhone : touche <b>Partager</b> puis <b>« Sur l'écran d'accueil »</b>.
  <button id="iosHintClose" aria-label="Fermer">✕</button>
